<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Sure Weather mark: sun + cloud duotone, bold shapes for small sizes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b7c9"/>
      <stop offset="1" stop-color="#0e8fa3"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- sun (top right) -->
  <circle cx="62" cy="34" r="13" fill="#ffd166"/>
  <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
    <line x1="62" y1="12" x2="62" y2="18"/>
    <line x1="62" y1="50" x2="62" y2="52"/>
    <line x1="40" y1="34" x2="46" y2="34"/>
    <line x1="80" y1="34" x2="84" y2="34"/>
    <line x1="47" y1="19" x2="51" y2="23"/>
    <line x1="73" y1="45" x2="77" y2="49"/>
    <line x1="47" y1="49" x2="51" y2="45"/>
    <line x1="73" y1="23" x2="77" y2="19"/>
  </g>
  <!-- cloud (front, bottom left) -->
  <path d="M26 66 a10 10 0 0 1 -1 -19.9 a12.5 12.5 0 0 1 24.3 -1.7 a9.4 9.4 0 0 1 1.4 18.7 z"
        fill="#ffffff" opacity=".96"/>
</svg>
