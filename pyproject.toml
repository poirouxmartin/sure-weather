[project]
name = "sure-weather"
version = "0.1.0"
description = "Multi-source weather fusion with per-provider confidence, targeting hyperlocal nowcasts and J+7 forecasts."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "numpy>=2.0",
    "pywebpush>=1.14",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sure-weather = "sure_weather.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sure_weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
